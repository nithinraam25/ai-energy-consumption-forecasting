name: CI & Deployment Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    name: Test, Validate Artifacts, and Build Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (ecCodes C-Library)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev libeccodes-tools curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Model Artifact Checksums (SHA-256)
        run: |
          python -c "
          import hashlib
          from pathlib import Path
          
          expected_hashes = {
              'adaptive_calibration_params.json': '5a7120d466348fa5c61e9a607bbc1b0c836a9e5e21fccc2501c48ecd0ed74147',
              'conformal_calibration_params.json': 'c9553be8f8253394c3a5cb2e659eb05511e49a600fc13e53ce3a1e5a970b8d3d',
              'pjm_probabilistic_forecaster_phase9.joblib': '51b2bd6837dcc9b62907a7486dcb9c8bbdc1861ba24c162fa99e366587cfadc3',
              'pjm_production_forecaster_phase8.joblib': 'f14d5b042afead93cc94e0653ae4e48fb45e800872f7c896bc6fb4d6d372c99d',
              'pjm_tree_forecaster.joblib': 'e3587d89c7fa1836e8631c4c2aa6d7f7ec4c1ef04fea43f8e0f29eddb8c19b76',
              'pjm_tree_forecaster_phase5a.joblib': '806978e5171e1b3dbb4826ac6452fc1ba354a408669dc90731d21157cc660402',
              'pjm_tree_forecaster_phase5a_refit.joblib': 'a8875bb04d344ced6d7499c6ca3d47aea0cf5053bcba475c781d9f4665798636',
              'pjm_tree_forecaster_phase6.joblib': '80360ac7cd094da5feda567bee0d4fae57f4abb56db264e8a6950c857f8a5053',
              'pjm_tree_forecaster_phase7.joblib': 'a2c832bd15d79854f007faaf6a5d537f232f9ddd35b94c11ba1d04686288a59a',
              'pjm_tree_forecaster_phase7_baseline.joblib': '806978e5171e1b3dbb4826ac6452fc1ba354a408669dc90731d21157cc660402',
              'pjm_tree_forecaster_phase7_observed.joblib': 'a2c832bd15d79854f007faaf6a5d537f232f9ddd35b94c11ba1d04686288a59a',
              'pjm_tree_forecaster_phase7_operational_nwp.joblib': '376c31bee5999246187aecc47e32f39f971f14c2dd627d8baf53141a2a012418',
              'production_feature_schema.json': 'ec3d06c078d6096140464796d6275447b1ea3400b498112de2e5f712a1583614',
              'production_model_config.json': '4d2596a6a891a4d33e6eb010b88f0d9d3c2f9b35315963f3c9267a13288de137',
              'weather_imputer_params.json': 'f9fb3125a36758183893ef250b1aea9a7d4ab1389701a680252e873f9c76acbd'
          }
          models_dir = Path('models')
          for name, exp_hash in expected_hashes.items():
              p = models_dir / name
              assert p.is_file(), f'Artifact missing: {name}'
              raw = p.read_bytes()
              if name.endswith('.json'):
                  raw = raw.replace(b'\r\n', b'\n')
              actual_hash = hashlib.sha256(raw).hexdigest()
              assert actual_hash == exp_hash, f'Checksum mismatch for {name}: expected {exp_hash}, got {actual_hash}'
          print('All 15 model artifact SHA-256 checksums verified successfully.')
          "

      - name: Run Full Automated Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Verify Evaluation Pipeline Reproducibility
        run: |
          python -m src.evaluation.evaluate_accuracy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        run: |
          docker build -t ai-energy-consumption-forecaster:latest .

      - name: Test Docker Container Execution & Endpoints
        run: |
          docker run -d --name forecaster-app -p 8000:8000 ai-energy-consumption-forecaster:latest
          
          # Poll until server is ready (up to 30 seconds)
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health | grep -q '"status":"HEALTHY"'; then
              echo "FastAPI application inside Docker container is HEALTHY!"
              break
            fi
            echo "Waiting for container server readiness... ($i/30)"
            sleep 1
          done

          # Test health endpoint
          curl -f -s http://localhost:8000/health | grep '"status":"HEALTHY"'

          # Test dashboard endpoint
          curl -f -s http://localhost:8000/dashboard | grep 'PJM East AI Energy Forecasting Dashboard'

          # Test evaluation metrics endpoint
          curl -f -s http://localhost:8000/api/evaluation/metrics | grep -E '"test_sample_count":\s*21773'

          # Cleanup
          docker stop forecaster-app
          docker rm forecaster-app
          echo "Docker container verification completed successfully."
