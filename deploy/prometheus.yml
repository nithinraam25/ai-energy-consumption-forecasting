# Prometheus Scraping Configuration for PJM East Energy Consumption Forecasting API

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "pjm-energy-forecaster"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["forecasting-api:8000", "localhost:8000"]
        labels:
          region: "pjm_east"
          environment: "production"
          service: "energy_demand_forecaster"
